version: "3.9"

services:
  bookdock:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: bookdock
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      NODE_ENV: production
      PORT: 8088
      # SQLite database (persisted in volume)
      DATABASE_URL: file:/data/db/bookdock.db
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      # NAS / data paths inside container
      NAS_EBOOK_PATH: /data/ebooks
      NAS_AUDIO_PATH: /data/audio
      SOURCE_LOCAL_PATH: /data/sources
      # TTS runs inside same container
      TTS_API_URL: http://localhost:5000
      # App settings
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8088}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      # Database persistence
      - bookdock-db:/data/db
      # E-book library (read-only recommended if scanning)
      - ${NAS_EBOOK_PATH:-./data/ebooks}:/data/ebooks
      # Audio output for TTS
      - ${NAS_AUDIO_PATH:-./data/audio}:/data/audio
      # Local source scanning path
      - ${NAS_SOURCE_PATH:-./data/sources}:/data/sources
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8088/health",
          "-o",
          "/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  bookdock-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NAS_DB_PATH:-./data/db}
