version: "3.9"

services:
  bookdock:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: bookdock
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      NODE_ENV: production
      PORT: 8088
      # SQLite database (persisted in volume)
      DATABASE_URL: file:/data/db/bookdock.db
      # NAS / data paths inside container
      NAS_EBOOK_PATH: /data/ebooks
      CACHE_PATH: /data/covers
      # MiMo TTS provider (optional — fill in to enable Xiaomi TTS)
      TTS_MIMO_API_TOKEN: sk-xxxx
      TTS_MIMO_MODEL: mimo-v2.5-tts
    volumes:
      # Database persistence
      - bookdock-db:/data/db
      # E-book library (read-only recommended if scanning)
      - ${NAS_EBOOK_PATH:-./data/ebooks}:/data/ebooks
      # Cover cache (read-only recommended)
      - ${CACHE_PATH:-./data/covers}:/data/covers

volumes:
  bookdock-db:
