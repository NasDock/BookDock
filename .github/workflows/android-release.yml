name: Build and Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Use the community autolinking path which correctly registers the
      # `expo-module-gradle-plugin` plugin id. The default
      # `expo-modules-autolinking` setup shipped with Expo SDK 52 has a
      # regression where the plugin id is never registered in
      # `pluginManagement`, causing any module that uses the new-style
      # `plugins { id 'expo-module-gradle-plugin' }` block
      # (e.g. expo-intent-launcher@56.0.4) to fail with
      # "Plugin [id: 'expo-module-gradle-plugin'] was not found".
      EXPO_USE_COMMUNITY_AUTOLINKING: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Android
        run: |
          cd apps/mobile
          npx expo prebuild --clean --platform android

      - name: Build Android APK
        env:
          # Use the community autolinking path which correctly registers
          # the `expo-module-gradle-plugin` plugin id. The default
          # `expo-modules-autolinking` setup shipped with Expo SDK 52 has
          # a regression where the plugin id is never registered in
          # `pluginManagement`, causing any module that uses the new-style
          # `plugins { id 'expo-module-gradle-plugin' }` block
          # (e.g. expo-intent-launcher@56.0.4) to fail with
          # "Plugin [id: 'expo-module-gradle-plugin'] was not found".
          EXPO_USE_COMMUNITY_AUTOLINKING: '1'
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          OLD_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="BookDock-${VERSION}.apk"
          NEW_PATH="apps/mobile/android/app/build/outputs/apk/release/${NEW_NAME}"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
