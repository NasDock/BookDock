name: Release Desktop App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            command: build:mac
          - os: windows-latest
            platform: win
            command: build:win
          - os: ubuntu-latest
            platform: linux
            command: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bookdock/desktop run ${{ matrix.command }}

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        if: matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/')
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## 新功能",
                    "labels": ["feat", "feature", "Feat", "Feature"]
                },
                {
                    "title": "## 修复",
                    "labels": ["fix", "bug", "Fix", "Bug"]
                },
                {
                    "title": "## 更新内容",
                    "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^\\s*(feat|fix|docs|style|refactor|perf|test|chore|revert|ci|build)(?:\\(.+\\))?!?: .+$",
                  "target": "$1",
                  "flags": "i"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Mac)
        uses: softprops/action-gh-release@v2
        if: matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          body: ${{ steps.build_changelog.outputs.changelog }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Win/Linux)
        uses: softprops/action-gh-release@v2
        if: matrix.platform != 'mac' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload artifacts to Minio
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS: ${{ secrets.MINIO_ACCESS }}
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
          MINIO_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}
        run: |
          export AWS_ACCESS_KEY_ID="${MINIO_ACCESS}"
          export AWS_SECRET_ACCESS_KEY="${MINIO_SECRET}"
          export AWS_DEFAULT_REGION="${MINIO_REGION}"
          aws s3 sync apps/desktop/release/ "s3://${MINIO_BUCKET}/bookdock/releases/${{ steps.version.outputs.version }}/" --endpoint-url "${MINIO_ENDPOINT}"
